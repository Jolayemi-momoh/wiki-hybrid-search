<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikipedia Hybrid Search Engine</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
            color: var(--accent-color);
        }
        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: var(--accent-color);
        }
        button {
            padding: 14px 24px;
            border-radius: 8px;
            border: none;
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .status-message {
            text-align: center;
            color: var(--text-muted);
            margin: 20px 0;
            display: none;
        }
        .results-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent-color);
        }
        .score-badge {
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .card-body {
            color: var(--text-muted);
            line-height: 1.5;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Wikipedia Search</h1>
            <p class="subtitle">Hybrid Vector (pgvector) + Keyword (BM25) search using RRF</p>
        </header>

        <div class="search-box">
            <input type="text" id="queryInput" placeholder="Enter topic (e.g., space exploration, Albert Einstein)..." onkeydown="if(event.key==='Enter') executeSearch()">
            <button onclick="executeSearch()">Search</button>
        </div>

        <div id="statusMessage" class="status-message">Executing hybrid search query...</div>
        <div id="resultsList" class="results-list"></div>
    </div>

    <script>
        async function executeSearch() {
            const query = document.getElementById("queryInput").value.trim();
            const statusMsg = document.getElementById("statusMessage");
            const resultsContainer = document.getElementById("resultsList");

            if (!query) return;

            statusMsg.style.display = "block";
            statusMsg.textContent = "Generating query vector & fetching hybrid results...";
            resultsContainer.innerHTML = "";

            try {
                const response = await fetch(`/search?q=${encodeURIComponent(query)}&limit=5`);
                if (!response.ok) throw new Error("Search API error");
                
                const results = await response.json();
                statusMsg.style.display = "none";

                if (results.length === 0) {
                    statusMsg.style.display = "block";
                    statusMsg.textContent = "No matching articles found.";
                    return;
                }

                results.forEach(item => {
                    const card = document.createElement("div");
                    card.className = "card";
                    card.innerHTML = `
                        <div class="card-header">
                            <span class="card-title">${item.title}</span>
                            <span class="score-badge">RRF: ${item.rrf_score.toFixed(4)}</span>
                        </div>
                        <div class="card-body">${item.chunk_text}</div>
                    `;
                    resultsContainer.appendChild(card);
                });

            } catch (err) {
                statusMsg.style.display = "block";
                statusMsg.textContent = `Error: ${err.message}.`;
            }
        }
    </script>
</body>
</html>
